[package]
name = "lxdl_engine"
version = "0.1.0"
edition = "2021"

[lib]
name = "lxdl_engine"
crate-type = ["cdylib"]

[dependencies]
rquickjs = { version = "0.9", features = ["full", "bindgen"] }
jni = "0.21"
serde_json = "1"
once_cell = "1"

[profile.release]
lto = true
opt-level = "z"
strip = true
