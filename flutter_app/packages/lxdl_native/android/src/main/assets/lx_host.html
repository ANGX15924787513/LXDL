<!doctype html>
<html><head><meta charset="utf-8"></head><body>
<script>
(function () {
  'use strict';
  var host = window.lxHost;
  var state = { inited: null, alert: null, result: null };
  var handlers = {};
  var calls = {};
  var httpCbs = {};
  var seq = 1;
  var dec = new TextDecoder('utf-8');
  var enc = new TextEncoder();

  function b64ToBytes(s) {
    var bin = atob(s || '');
    var out = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    return out;
  }
  function bytesToB64(bytes) {
    var s = '';
    for (var i = 0; i < bytes.length; i++) s += String.fromCharCode(bytes[i]);
    return btoa(s);
  }
  function errText(e) {
    if (e == null) return 'unknown error';
    if (typeof e === 'string') return e;
    if (e.message != null) return String(e.message);
    try { return JSON.stringify(e); } catch (_) { return String(e); }
  }
  function toJson(v) {
    try { var s = JSON.stringify(v); return s === undefined ? 'null' : s; }
    catch (e) { return JSON.stringify({ error: errText(e) }); }
  }

  // 极简 Buffer（音源脚本只用到 from / toString / concat / length）
  function Buf(u8) { return u8; }
  Buf.from = function (v, encoding) {
    if (typeof v === 'string') {
      var e = (encoding || 'utf8').toLowerCase();
      if (e === 'base64') return b64ToBytes(v);
      if (e === 'hex') {
        var out = new Uint8Array(Math.floor(v.length / 2));
        for (var i = 0; i < out.length; i++) out[i] = parseInt(v.substr(i * 2, 2), 16);
        return out;
      }
      return enc.encode(v);
    }
    if (v instanceof Uint8Array) return v;
    if (v instanceof ArrayBuffer) return new Uint8Array(v);
    if (Array.isArray(v)) return new Uint8Array(v);
    return new Uint8Array(0);
  };
  Buf.isBuffer = function (v) { return v instanceof Uint8Array; };
  Buf.concat = function (list) {
    var n = 0, i;
    for (i = 0; i < list.length; i++) n += list[i].length;
    var out = new Uint8Array(n), off = 0;
    for (i = 0; i < list.length; i++) { out.set(list[i], off); off += list[i].length; }
    return out;
  };
  function bufToString(buf, fmt) {
    var b = Buf.from(buf);
    var f = (fmt || 'utf8').toLowerCase();
    if (f === 'base64') return bytesToB64(b);
    if (f === 'hex') {
      var s = '';
      for (var i = 0; i < b.length; i++) s += (b[i] < 16 ? '0' : '') + b[i].toString(16);
      return s;
    }
    return dec.decode(b);
  }

  // 让 Uint8Array 用起来像 Node 的 Buffer（音源脚本里常见 .toString('base64') / .toString('hex')）
  Uint8Array.prototype.toString = function (encoding) {
    return bufToString(this, encoding || 'utf8');
  };
  window.Buffer = {
    from: Buf.from,
    isBuffer: Buf.isBuffer,
    concat: Buf.concat,
    alloc: function (n) { return new Uint8Array(Number(n) || 0); }
  };

  function normOptions(o) {
    o = o || {};
    var out = {
      method: (o.method || 'GET').toUpperCase(),
      headers: {},
      timeout: Number(o.timeout) || 20000,
      responseType: o.responseType || 'text',
      body: null,
      bodyEncoding: 'text',
      form: false,
      formData: false
    };
    if (o.headers) Object.keys(o.headers).forEach(function (k) {
      if (o.headers[k] != null) out.headers[k] = String(o.headers[k]);
    });
    function urlenc(obj) {
      return Object.keys(obj).map(function (k) {
        return encodeURIComponent(k) + '=' + encodeURIComponent(obj[k] == null ? '' : String(obj[k]));
      }).join('&');
    }
    function formHeaders() {
      if (!out.headers['Content-Type'] && !out.headers['content-type']) {
        out.headers['Content-Type'] = 'application/x-www-form-urlencoded';
      }
    }
    if (o.form) { out.body = urlenc(o.form); out.form = true; formHeaders(); }
    if (o.formData) { out.body = urlenc(o.formData); out.formData = true; formHeaders(); }
    if (o.body != null) {
      if (typeof o.body === 'string') { out.body = o.body; out.bodyEncoding = 'text'; }
      else if (o.body instanceof Uint8Array || o.body instanceof ArrayBuffer || Array.isArray(o.body)) {
        out.body = bytesToB64(Buf.from(o.body));
        out.bodyEncoding = 'base64';
      } else {
        // 普通对象按表单发
        out.body = urlenc(o.body);
        out.bodyEncoding = 'text';
        formHeaders();
      }
    }
    return JSON.stringify(out);
  }

  var lx = {
    version: '2.0.0',
    env: 'mobile',
    EVENT_NAMES: { request: 'request', inited: 'inited', updateAlert: 'updateAlert' },
    on: function (name, fn) { handlers[String(name)] = fn; },
    send: function (name, data) {
      name = String(name);
      if (name === 'inited') state.inited = data;
      if (name === 'updateAlert') state.alert = data;
      host.send(name, toJson(data));
    },
    request: function (url, options, cb) {
      if (typeof options === 'function') { cb = options; options = {}; }
      var id = seq++;
      httpCbs[id] = cb;
      host.request(id, String(url), normOptions(options));
      return function cancel() {
        delete httpCbs[id];
        try { host.cancel(id); } catch (_) {}
      };
    },
    utils: {
      buffer: { from: Buf.from, bufToString: bufToString },
      crypto: {
        md5: function (v) { return host.md5(typeof v === 'string' ? v : bufToString(v)); },
        aesEncrypt: function (data, mode, key, iv) {
          var out = host.aesEncrypt(
            bytesToB64(Buf.from(data)), String(mode),
            bytesToB64(Buf.from(key)), iv == null ? '' : bytesToB64(Buf.from(iv)));
          if (out.indexOf('\u0001ERR:') === 0) throw new Error(out.slice(6));
          return b64ToBytes(out);
        },
        rsaEncrypt: function (data, pem) {
          var out = host.rsaEncrypt(bytesToB64(Buf.from(data)), String(pem));
          if (out.indexOf('\u0001ERR:') === 0) throw new Error(out.slice(6));
          return b64ToBytes(out);
        },
        randomBytes: function (n) { return b64ToBytes(host.randomBytes(Number(n) || 0)); }
      }
    }
  };
  Object.defineProperty(lx, 'currentScriptInfo', {
    get: function () { return window.__lxScriptInfo || {}; }
  });
  window.lx = lx;

  window.console = window.console || {};
  ['log', 'info', 'warn', 'error'].forEach(function (level) {
    window.console[level] = function () {
      var parts = [];
      for (var i = 0; i < arguments.length; i++) parts.push(errText(arguments[i]));
      host.log(level, parts.join(' '));
    };
  });

  window.__lxHttpDone = function (id, err, status, statusText, headersJson, bodyB64, binary) {
    var cb = httpCbs[id];
    if (!cb) return;
    delete httpCbs[id];
    var e = null, resp = null;
    if (err) { e = new Error(err); }
    else {
      var body = binary ? b64ToBytes(bodyB64 || '').buffer : dec.decode(b64ToBytes(bodyB64 || ''));
      resp = {
        statusCode: status,
        statusMessage: statusText,
        status: status,
        statusText: statusText,
        headers: JSON.parse(headersJson || '{}'),
        body: body,
        raw: body
      };
    }
    try { cb(e, resp); } catch (x) { host.log('error', errText(x)); }
  };

  window.__lxSetScriptInfo = function (json) { window.__lxScriptInfo = JSON.parse(json || '{}'); };

  window.__lxAction = function (id, source, action, infoJson, timeoutMs) {
    var info = JSON.parse(infoJson || '{}');
    var timer = setTimeout(function () {
      host.send('__result', JSON.stringify({ id: id, ok: false, error: 'timeout' }));
    }, timeoutMs || 90000);
    var fn = handlers['request'];
    if (typeof fn !== 'function') {
      clearTimeout(timer);
      return host.send('__result', JSON.stringify({ id: id, ok: false, error: '脚本没有注册 request 事件' }));
    }
    var p;
    try { p = fn({ source: source, action: action, info: info }); }
    catch (e) { clearTimeout(timer); return host.send('__result', JSON.stringify({ id: id, ok: false, error: errText(e) })); }
    Promise.resolve(p).then(function (v) {
      clearTimeout(timer);
      host.send('__result', JSON.stringify({ id: id, ok: true, value: v === undefined ? null : v }));
    }, function (e) {
      clearTimeout(timer);
      host.send('__result', JSON.stringify({ id: id, ok: false, error: errText(e) }));
    });
  };

  window.__lxState = function () { return toJson(state); };
  window.__lxReady = true;
})();
</script>
</body></html>
