name: lxdl
description: 洛雪音源下载器
publish_to: none
version: 1.0.0+1
environment:
  sdk: ">=3.4.0 <4.0.0"
dependencies:
  flutter:
    sdk: flutter
  lxdl_native:
    path: packages/lxdl_native
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: "^0.14.4"
flutter:
  uses-material-design: true
  assets:
    - assets/lx_host.html
flutter_launcher_icons:
  android: "launcher_icon" # Android端图标名称
  ios: true                # 同时生成iOS图标
  image_path: "icon.png"
