name: build-apk

on:
  push:
    paths:
      - "flutter_app/**"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

# 新增：允许 Action 创建 Release
permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21" # 记得保持你的 Java 21

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: flutter_app
        run: flutter pub get

      - name: Build APK
        working-directory: flutter_app
        run: flutter build apk --release

      # 可选：保留 Artifacts 作为备用
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: lxdl-apk
          path: flutter_app/build/app/outputs/flutter-apk/*.apk

      # 新增：自动发布到 Release
      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "build-${{ github.run_number }}" # 每次运行生成一个新的版本号
          name: "LXDL 自动构建 v${{ github.run_number }}"
          files: flutter_app/build/app/outputs/flutter-apk/app-release.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
