name: build-apk

on:
  push:
    paths:
      - "flutter_app/**"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: 对齐 Gradle/AGP（用 Flutter 模板的脚手架）
        run: |
          flutter create --platforms=android --org com.lxdl --project-name app /tmp/tpl
          cd flutter_app
          rm -f android/settings.gradle android/settings.gradle.kts \
                android/build.gradle android/build.gradle.kts android/gradle.properties
          for f in settings.gradle settings.gradle.kts build.gradle build.gradle.kts gradle.properties; do
            if [ -f "/tmp/tpl/android/$f" ]; then cp "/tmp/tpl/android/$f" android/; fi
          done
          rm -rf android/gradle android/gradlew android/gradlew.bat
          cp -r /tmp/tpl/android/gradle android/gradle
          cp /tmp/tpl/android/gradlew android/gradlew
          chmod +x android/gradlew

      - name: pub get
        working-directory: flutter_app
        run: flutter pub get

      - name: build apk
        working-directory: flutter_app
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: lxdl-apk
          path: flutter_app/build/app/outputs/flutter-apk/*.apk
